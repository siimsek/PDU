# WP1 2026-10-25-o1-ovp: re-run the proposal ngspice decks and the independent verifier.
# No secrets are used. Read-only token. Proposal-only: does not touch baseline results.
name: proposal-ngspice
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'simulation/proposals/2026-10-25-o1-ovp/**'
      - 'hardware/proposals/2026-10-25-o1-ovp/**'
      - '.github/workflows/proposal-ngspice.yml'
permissions:
  contents: read
jobs:
  o1-ovp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: simulation/proposals/2026-10-25-o1-ovp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ngspice (apt)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice && ngspice --version || true
      - name: Regenerate decks and check they match the committed ones
        run: |
          python3 gen_o1ovp.py
          git status --porcelain -- . | tee /tmp/gen-diff.txt
          test ! -s /tmp/gen-diff.txt
      - name: Conditional window budget (rev2 >= 50 mV target, rev3 P0-04 wording; must match committed JSON)
        run: |
          python3 window_budget.py --json /tmp/window-budget.json > /dev/null
          cmp /tmp/window-budget.json window-budget.json
          python3 -c "import json,sys; m=json.load(open('/tmp/window-budget.json'))['margin_summary']; print(m['min_guaranteed_V'], m['min_with_life_V']); sys.exit(0 if m['meets_target'] and m['meets_target_with_life'] else 1)"
      - name: Gate-discharge worst-case bound (P0-3, analytic; must match committed JSON)
        run: |
          python3 gate_discharge_wc.py --json /tmp/gate-discharge-wc.json > /dev/null
          cmp /tmp/gate-discharge-wc.json gate-discharge-wc.json
          python3 -c "import json,sys; d=json.load(open('/tmp/gate-discharge-wc.json')); sys.exit(0 if d['conclusion_ok'] else 1)"
      - name: Normal-bus and false-trip constants present (P1-2; criteria must not be loosened)
        run: |
          grep -q "NORMAL_MAX = 11.1605" run_o1ovp.py
          grep -q "NORMAL_MAX = 11.1605" verify_candidate.py
          grep -q "FALSE_TRIP_TEST = 11.22" run_o1ovp.py
          grep -q "O1_GLOBAL_PEAK" run_o1ovp.py
          grep -q "o1_global_peak" verify_candidate.py
      - name: RAW divider power/derating (rev3 P0-01; must match committed JSON)
        run: |
          python3 rsns_power.py --check > /dev/null
          git diff --exit-code -- rsns-power.json
      - name: Run proposal decks (+ baseline regression, expected FAIL)
        id: run
        continue-on-error: true
        run: PDU_NGSPICE="$(command -v ngspice)" python3 run_o1ovp.py --jobs 4 --label "ci-${GITHUB_RUN_ID}"
      - name: Independent verification
        run: |
          python3 verify_candidate.py
      - name: Baseline regression must FAIL (exit 1)
        run: |
          set +e; python3 verify_candidate.py --baseline-regression; rc=$?; set -e
          test "$rc" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o1ovp-results
          path: |
            simulation/proposals/2026-10-25-o1-ovp/o1ovp-results.json
            simulation/proposals/2026-10-25-o1-ovp/results/
