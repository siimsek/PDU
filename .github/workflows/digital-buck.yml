name: Digital buck native verification
on:
  push:
    branches: [stm32-digital-buck]
  pull_request:
    branches: [main, stm32-digital-buck]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
      - uses: actions/cache@v4
        with:
          path: build/tools
          key: pdu-native-20261124-${{ runner.os }}-${{ runner.arch }}-arm14.3-ng47
      - run: python -m control.tools
      - run: python -m control.verify --firmware
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdu-${{ runner.os }}
          if-no-files-found: warn
          path: |
            build/verify/results.json
            build/verify/*.svg
            build/verify/baseline/power.log
            build/verify/replay/power.log
            build/verify/target/firmware/pdu_g474.elf
            build/verify/target/firmware/pdu_g474.bin
            build/verify/target/firmware/pdu_g474.map

  numerical-equivalence:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: pdu-*
          path: builds
      - run: python -m control.verify --compare builds/pdu-Linux/results.json builds/pdu-Windows/results.json
